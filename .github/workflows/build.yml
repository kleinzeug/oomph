name: Build

# Proves the README's promise: a fresh clone builds with one command, and the
# daemon + CLI work end to end (unprivileged) on a stock macOS runner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build from a clean clone
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the version derives from `git describe` (tools/version.sh)

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          /usr/bin/python3 --version

      - name: Lint scripts and plists
        run: |
          bash -n build-app.sh install.sh uninstall.sh
          plutil -lint app/Info.plist daemon/local.oomph.daemon.plist
          /usr/bin/python3 -I -m py_compile daemon/oomphd.py daemon/oomph.py daemon/oomph_darwin.py daemon/oomph_ai.py daemon/oomph_upgrade.py daemon/oomph_top.py daemon/oomph_view.py tools/selftest.py tools/roottest.py tools/brandlint.py tools/chartvectors.py tools/topfixture.py tools/fixtureplat.py
          sh -n tools/version.sh && echo "version: $(tools/version.sh)"
          /usr/bin/python3 -I -B tools/brandlint.py   # the product's name (BRAND) apart from the command and paths

      - name: Daemon + CLI self-test
        # Samples this runner into a temp dir, simulates a jetsam storm, and checks
        # the incident lifecycle, the HTML report and every CLI command, the chart maths of
        # `oomph top` against tools/vectors/chart.json and its golden frames (tools/golden/top).
        run: /usr/bin/python3 -I -B tools/selftest.py

      - name: Root test (H0)
        # As real root (the runner has passwordless sudo): neither the daemon nor
        # `sudo oomph reserve` opens anything in the world-writable ledger directory,
        # whatever is planted there, and the sampler never waits on it. First the dry
        # run (unprivileged, pretending), then the real one.
        run: |
          /usr/bin/python3 -I -B tools/roottest.py
          sudo /usr/bin/python3 -I -B tools/roottest.py

      - name: Install over 1.8.4, then uninstall (as root)
        # The real install on this runner. 1.8.4's installer leaves the old layout (a real
        # directory); this commit's moves it aside and makes /usr/local/libexec/oomph a link to
        # a directory of its own version. The logger runs from there, installing again changes
        # nothing, a version replaced more than 7 days ago is removed, and uninstall.sh leaves
        # nothing behind.
        run: |
          VER=$(tools/version.sh)
          git worktree add -q "$RUNNER_TEMP/v1.8.4" v1.8.4
          sudo "$RUNNER_TEMP/v1.8.4/install.sh"
          test -d /usr/local/libexec/oomph && test ! -L /usr/local/libexec/oomph
          OLDV=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' /usr/local/libexec/oomph/oomph.py)
          echo "1.8.4's installer stamped $OLDV"
          sudo ./install.sh
          ls -la /usr/local/libexec
          test "$(readlink /usr/local/libexec/oomph)" = "oomph-$VER"
          test -f "/usr/local/libexec/oomph-$OLDV/oomphd.py"
          test "$(/usr/local/bin/oomph version)" = "$VER"
          sudo launchctl print system/local.oomph.daemon | grep -q "state = running"
          v=""
          for i in $(seq 1 30); do
            v=$(/usr/bin/python3 -I -c 'import json; print(json.load(open("/Library/Logs/oomph/current.json"))["daemon"]["version"])' 2>/dev/null || true)
            [ "$v" = "$VER" ] && break
            sleep 2
          done
          echo "the logger reports $v"
          test "$v" = "$VER"
          sudo ./install.sh
          test "$(ls -d /usr/local/libexec/oomph-* | wc -l | tr -d ' ')" = 2
          sudo touch -t 202001010000 "/usr/local/libexec/oomph-$OLDV"
          sudo ./install.sh
          test ! -e "/usr/local/libexec/oomph-$OLDV"
          sudo ./uninstall.sh --purge
          if ls -d /usr/local/libexec/oomph* /usr/local/bin/oomph /Library/LaunchDaemons/local.oomph.daemon.plist 2>/dev/null; then
            echo "::error::uninstall.sh left files behind"; exit 1
          fi
          git worktree remove --force "$RUNNER_TEMP/v1.8.4"

      - name: Old upgraders build this commit
        # Installed copies upgrade themselves: their own `oomph upgrade build` runs main's
        # build-app.sh. The upgraders of v1.6.2 and v1.8.1 must still get an app out of it.
        run: |
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/up-repo"
          git -C "$RUNNER_TEMP/up-repo" checkout -q -B main "$(git rev-parse HEAD)"
          for tag in v1.6.2 v1.8.1; do
            old="$RUNNER_TEMP/old-$tag"
            mkdir -p "$old"
            git archive "$tag" daemon | tar -x -C "$old"
            OOMPH_REPO="$RUNNER_TEMP/up-repo" OOMPH_UPGRADE_DIR="$RUNNER_TEMP/up-$tag" \
              /usr/bin/python3 -I -B "$old/daemon/oomph.py" upgrade build | tail -n 3
            app="$RUNNER_TEMP/up-$tag/staging/oomph.app"
            test -x "$app/Contents/MacOS/oomph" || { echo "::error::the $tag upgrader built no app"; exit 1; }
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")
            [ "$id" = "local.oomph.menubar" ] || { echo "::error::$tag upgrader: bundle id $id"; exit 1; }
          done

      - name: Build oomph.app
        # Exactly what a contributor runs; ad-hoc signed, no Apple account.
        run: ./build-app.sh "$RUNNER_TEMP/dist"

      - name: Chart vectors, both programs
        # The chart maths exist twice: in the app (Swift) and in `oomph top` (Python). The
        # app's answers are tools/vectors/chart.json; both must reproduce them.
        run: |
          /usr/bin/python3 -I -B tools/chartvectors.py
          /usr/bin/python3 -I -B tools/chartvectors.py --app "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph"

      - name: Verify app bundle
        run: |
          APP="$RUNNER_TEMP/dist/oomph.app"
          PLIST="$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/oomph" || { echo "::error::no executable in the bundle"; exit 1; }

          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          agent=$(/usr/libexec/PlistBuddy -c "Print :LSUIElement" "$PLIST")
          echo "bundle id: $id"
          echo "version:   $version"
          echo "agent app: $agent"
          [ "$id" = "local.oomph.menubar" ] || { echo "::error::unexpected bundle id $id"; exit 1; }
          [ "$agent" = "true" ] || { echo "::error::LSUIElement not set — would show a Dock icon"; exit 1; }
          [ "$version" = "$(tools/version.sh)" ] || { echo "::error::bundle version $version != git describe"; exit 1; }
          grep -q "^VERSION = \"$version\"" "$APP/Contents/Resources/oomph.py" || { echo "::error::bundled CLI not stamped"; exit 1; }

          # Activate/Deactivate run these from the bundle.
          for f in install.sh uninstall.sh oomphd.py oomph.py oomph_darwin.py oomph_ai.py oomph_upgrade.py oomph_top.py oomph_view.py local.oomph.daemon.plist; do
            test -f "$APP/Contents/Resources/$f" || { echo "::error::$f missing from bundle"; exit 1; }
          done
          test -x "$APP/Contents/Resources/install.sh" || { echo "::error::install.sh not executable"; exit 1; }
          test -f "$APP/Contents/Resources/skills/oomph/SKILL.md" || { echo "::error::Claude skill missing from bundle"; exit 1; }

          lipo -info "$APP/Contents/MacOS/oomph"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          cd "$RUNNER_TEMP/dist"
          ditto -c -k --keepParent oomph.app oomph.zip

      - uses: actions/upload-artifact@v4
        with:
          name: oomph-app
          path: ${{ runner.temp }}/dist/oomph.zip
          retention-days: 14
          if-no-files-found: error

  linux:
    # The portable half on Linux: oomph and oomphd import without macOS's libraries, and the
    # self-test runs everything that needs no Mac (the logger's bookkeeping, incidents, reports,
    # the ledger and its hardening, the CLI, oomph top, the AI harness) on a stand-in backend
    # (tools/fixtureplat.py). What needs macOS or a backend that measures Linux (1.9.4) is
    # skipped and says so.
    name: Portable half on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version derives from `git describe`

      - name: Toolchain
        run: |
          uname -a
          python3 --version

      - name: Import without macOS
        run: |
          python3 -I -m py_compile daemon/*.py tools/*.py
          python3 -I -B -c 'import sys; sys.path.insert(0, "daemon"); import oomph, oomphd, oomph_top, oomph_view, oomph_ai, oomph_upgrade; assert "ctypes" not in sys.modules and "oomph_darwin" not in sys.modules; print("imported", oomph.VERSION, oomph.LOG_DIR, oomph.LEDGER_DIR)'
          set +e; python3 -I -B daemon/oomph.py doctor; rc=$?; set -e
          echo "doctor exit $rc"; test "$rc" = 2   # nothing measures Linux yet: it says so, and exits 2

      - name: Self-test, portable half
        run: python3 -I -B tools/selftest.py
