name: Build

# Proves the README's promise: a fresh clone builds with one command, and the
# daemon + CLI work end to end (unprivileged) on a stock macOS runner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build from a clean clone
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the version derives from `git describe` (tools/version.sh)

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          /usr/bin/python3 --version

      - name: Lint scripts and plists
        run: |
          bash -n build-app.sh install.sh uninstall.sh tools/spike_role_account.sh
          sh -n linux/install.sh linux/uninstall.sh
          plutil -lint app/Info.plist daemon/local.oomph.daemon.plist
          /usr/bin/python3 -I -m py_compile daemon/oomphd.py daemon/oomph.py daemon/oomph_darwin.py daemon/oomph_linux.py daemon/oomph_ioreport.py daemon/oomph_ai.py daemon/oomph_upgrade.py daemon/oomph_top.py daemon/oomph_view.py daemon/oomph_net.py daemon/oomph_sync.py tools/selftest.py tools/nettest.py tools/sharetest.py tools/roottest.py tools/brandlint.py tools/chartvectors.py tools/connectvectors.py tools/topfixture.py tools/toptest.py tools/fixtureplat.py tools/mirrorfixture.py tools/renderfixture.py tools/ledgercompat.py tools/linuxtest.py tools/linuxfixture.py
          sh -n tools/version.sh && echo "version: $(tools/version.sh)"
          /usr/bin/python3 -I -B tools/brandlint.py   # the product's name (BRAND) apart from the command and paths

      - name: tmux, the oracle of the terminal tests
        # tools/toptest.py paints frames into tmux and reads them back; with CI set, a missing tmux
        # fails the test instead of skipping it.
        run: command -v tmux || brew install tmux

      - name: Daemon + CLI self-test
        # Samples this runner into a temp dir, simulates a jetsam storm, and checks
        # the incident lifecycle, the HTML report and every CLI command, the chart maths of
        # `oomph top` against tools/vectors/chart.json, its golden frames (tools/golden/top) and
        # the full-screen program in a pseudo-terminal (tools/toptest.py).
        run: /usr/bin/python3 -I -B tools/selftest.py

      - name: oomph top for a minute
        # The budget of the terminal dashboard (roadmap 04 §4.9): installed as install.sh installs it
        # (compiled), a minute at 160 x 48 on 14 days of data with a sample every 10 s, in a
        # pseudo-terminal: under 1 % of a core and 40 MB peak resident; the numbers are in the log. A shared
        # runner gets a margin: over 1 % warns, over 1.5 % fails (three times the logger's rate, so still strict).
        run: /usr/bin/python3 -I -B tools/toptest.py --minute

      - name: Root test (H0)
        # As real root (the runner has passwordless sudo): neither the daemon nor
        # `sudo oomph reserve` opens anything in the world-writable ledger directory,
        # whatever is planted there, and the sampler never waits on it. First the dry
        # run (unprivileged, pretending), then the real one.
        run: |
          /usr/bin/python3 -I -B tools/roottest.py
          sudo /usr/bin/python3 -I -B tools/roottest.py

      - name: Install over 1.8.4, then uninstall (as root)
        # The real install on this runner. 1.8.4's installer leaves the old layout (a real
        # directory); this commit's moves it aside and makes /usr/local/libexec/oomph a link to
        # a directory of its own version. The logger runs from there, installing again changes
        # nothing, a version replaced more than 7 days ago is removed, and uninstall.sh leaves
        # nothing behind.
        run: |
          VER=$(tools/version.sh)
          git worktree add -q "$RUNNER_TEMP/v1.8.4" v1.8.4
          sudo "$RUNNER_TEMP/v1.8.4/install.sh"
          test -d /usr/local/libexec/oomph && test ! -L /usr/local/libexec/oomph
          OLDV=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' /usr/local/libexec/oomph/oomph.py)
          echo "1.8.4's installer stamped $OLDV"
          sudo ./install.sh
          ls -la /usr/local/libexec
          test "$(readlink /usr/local/libexec/oomph)" = "oomph-$VER"
          test -f "/usr/local/libexec/oomph-$OLDV/oomphd.py"
          test "$(/usr/local/bin/oomph version)" = "$VER"
          sudo launchctl print system/local.oomph.daemon | grep -q "state = running"
          v=""
          for i in $(seq 1 30); do
            v=$(/usr/bin/python3 -I -c 'import json; print(json.load(open("/Library/Logs/oomph/current.json"))["daemon"]["version"])' 2>/dev/null || true)
            [ "$v" = "$VER" ] && break
            sleep 2
          done
          echo "the logger reports $v"
          test "$v" = "$VER"
          sudo ./install.sh
          test "$(ls -d /usr/local/libexec/oomph-* | wc -l | tr -d ' ')" = 2
          sudo touch -t 202001010000 "/usr/local/libexec/oomph-$OLDV"
          sudo ./install.sh
          test ! -e "/usr/local/libexec/oomph-$OLDV"
          sudo ./uninstall.sh --purge
          if ls -d /usr/local/libexec/oomph* /usr/local/bin/oomph /Library/LaunchDaemons/local.oomph.daemon.plist 2>/dev/null; then
            echo "::error::uninstall.sh left files behind"; exit 1
          fi
          git worktree remove --force "$RUNNER_TEMP/v1.8.4"

      - name: Sharing as real root (remote machines, 1.10.0)
        # The share service for real (roadmap 01 §12): `sudo oomph share on --pair` creates the group and the
        # role account _oomph and asserts them, key.pem root:_oomph 640, the LaunchDaemon under _oomph; a
        # viewer (the runner's user) pairs over loopback with the printed code, cold; share status as that
        # user shows no secret; revoke refuses the viewer; install.sh over a sharing install keeps it on;
        # uninstall.sh then install.sh brings it back with the same key; uninstall.sh --purge removes the
        # account, the state and the job. The runner is thrown away afterwards.
        run: sudo CI=1 /usr/bin/python3 -I -B tools/sharetest.py root

      - name: Old upgraders build this commit
        # Installed copies upgrade themselves: their own `oomph upgrade build` runs main's
        # build-app.sh. The upgraders of v1.6.2 and v1.8.1 must still get an app out of it.
        run: |
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/up-repo"
          git -C "$RUNNER_TEMP/up-repo" checkout -q -B main "$(git rev-parse HEAD)"
          for tag in v1.6.2 v1.8.1; do
            old="$RUNNER_TEMP/old-$tag"
            mkdir -p "$old"
            git archive "$tag" daemon | tar -x -C "$old"
            OOMPH_REPO="$RUNNER_TEMP/up-repo" OOMPH_UPGRADE_DIR="$RUNNER_TEMP/up-$tag" \
              /usr/bin/python3 -I -B "$old/daemon/oomph.py" upgrade build | tail -n 3
            app="$RUNNER_TEMP/up-$tag/staging/oomph.app"
            test -x "$app/Contents/MacOS/oomph" || { echo "::error::the $tag upgrader built no app"; exit 1; }
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")
            [ "$id" = "local.oomph.menubar" ] || { echo "::error::$tag upgrader: bundle id $id"; exit 1; }
          done

      - name: Build oomph.app
        # Exactly what a contributor runs; ad-hoc signed, no Apple account.
        run: ./build-app.sh "$RUNNER_TEMP/dist"

      - name: Chart vectors, both programs
        # The chart maths exist twice: in the app (Swift) and in `oomph top` (Python). The
        # app's answers are tools/vectors/chart.json; both must reproduce them.
        run: |
          /usr/bin/python3 -I -B tools/chartvectors.py
          /usr/bin/python3 -I -B tools/chartvectors.py --app "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph"
          # the connect popover (1.10.2): links, codes, addresses and its messages, as the CLI reads them
          /usr/bin/python3 -I -B tools/connectvectors.py --app "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph"

      - name: Renders repeat themselves
        # The app's --render-popup with --fixture DIR, --now T and --no-liveness (1.10.6, roadmap 02 §8): every
        # state of tools/renderfixture.py's fixture drawn twice is byte-identical, an hour later by --now is not,
        # nor is a render that asks whether the fixture's holders live. What the TimeAxis refactor is held to.
        run: /usr/bin/python3 -I -B tools/renderfixture.py --app "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph"

      - name: The four resources, switched on (1.11.0)
        # The popup of 02 §3.7 behind resourcesUI (off for users): every state of tools/renderfixture.py's
        # RESOURCES list (each selection and focus, the callouts, hover, the compact levels, the capsule's
        # verdicts, no GPU, an old logger; from 1.12.3 the bands per reserved resource, a hovered row and block),
        # light and dark, drawn with the switch forced on; kept as an artifact.
        run: /usr/bin/python3 -I -B tools/renderfixture.py --app "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph" --resources "$RUNNER_TEMP/resources"

      - uses: actions/upload-artifact@v4
        with:
          name: oomph-resources-renders
          path: ${{ runner.temp }}/resources
          retention-days: 14
          if-no-files-found: error

      - name: The popup draws a mirror
        # Another machine's mirror, made through a pipe by the real `oomph remote sync --once`
        # (tools/mirrorfixture.py) and drawn by the app: not connected, a stretch not received.
        # Not a gate yet: the runner's ability to render is untried.
        continue-on-error: true
        run: |
          /usr/bin/python3 -I -B tools/mirrorfixture.py "$RUNNER_TEMP/mirror" offline
          "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph" --render-popup "$RUNNER_TEMP/mirror.png" \
            --mirror "$RUNNER_TEMP/mirror/mirror" -aiOn NO
          test -s "$RUNNER_TEMP/mirror.png" && sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/mirror.png"
          # the tabs of 1.10.0, switched off for users (machinesUI), drawn with the switch forced on
          /usr/bin/python3 -I -B tools/mirrorfixture.py "$RUNNER_TEMP/mfx" machines
          OOMPH_MACHINES_DIR="$RUNNER_TEMP/mfx/machines" "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph" \
            --render-popup "$RUNNER_TEMP/tabs.png" -aiOn NO -machinesUI YES -selectedMachine m-7f3a9c1e5b2d4a68
          test -s "$RUNNER_TEMP/tabs.png" && sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/tabs.png"
          # a machine that was live when the popup closed, reconnecting: the grace, then Connecting…
          OOMPH_MACHINES_DIR="$RUNNER_TEMP/mfx/machines" "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph" \
            --render-popup "$RUNNER_TEMP/tabs-reopen.png" -aiOn NO -machinesUI YES -selectedMachine m-4e5f607182930415 -openedAgo 2
          test -s "$RUNNER_TEMP/tabs-reopen.png"
          # the + and its popover (1.10.2), also switched off for users: Recents, the code step, Share this Mac
          /usr/bin/python3 -I -B tools/mirrorfixture.py "$RUNNER_TEMP/rfx" recents
          for st in add pair:link sharecode tour:4; do
            OOMPH_MACHINES_DIR="$RUNNER_TEMP/rfx/machines" "$RUNNER_TEMP/dist/oomph.app/Contents/MacOS/oomph" \
              --render-popup "$RUNNER_TEMP/plus-${st%%:*}.png" --ai "$st" -aiOn NO -machinesUI YES
            test -s "$RUNNER_TEMP/plus-${st%%:*}.png"
          done

      - name: Verify app bundle
        run: |
          APP="$RUNNER_TEMP/dist/oomph.app"
          PLIST="$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/oomph" || { echo "::error::no executable in the bundle"; exit 1; }

          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          agent=$(/usr/libexec/PlistBuddy -c "Print :LSUIElement" "$PLIST")
          echo "bundle id: $id"
          echo "version:   $version"
          echo "agent app: $agent"
          [ "$id" = "local.oomph.menubar" ] || { echo "::error::unexpected bundle id $id"; exit 1; }
          [ "$agent" = "true" ] || { echo "::error::LSUIElement not set — would show a Dock icon"; exit 1; }
          [ "$version" = "$(tools/version.sh)" ] || { echo "::error::bundle version $version != git describe"; exit 1; }
          grep -q "^VERSION = \"$version\"" "$APP/Contents/Resources/oomph.py" || { echo "::error::bundled CLI not stamped"; exit 1; }

          # Activate/Deactivate run these from the bundle.
          for f in install.sh uninstall.sh oomphd.py oomph.py oomph_darwin.py oomph_linux.py oomph_ioreport.py oomph_ai.py oomph_upgrade.py oomph_top.py oomph_view.py oomph_net.py oomph_sync.py local.oomph.daemon.plist; do
            test -f "$APP/Contents/Resources/$f" || { echo "::error::$f missing from bundle"; exit 1; }
          done
          test -x "$APP/Contents/Resources/install.sh" || { echo "::error::install.sh not executable"; exit 1; }
          test -f "$APP/Contents/Resources/skills/oomph/SKILL.md" || { echo "::error::Claude skill missing from bundle"; exit 1; }

          lipo -info "$APP/Contents/MacOS/oomph"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          cd "$RUNNER_TEMP/dist"
          ditto -c -k --keepParent oomph.app oomph.zip

      - uses: actions/upload-artifact@v4
        with:
          name: oomph-app
          path: ${{ runner.temp }}/dist/oomph.zip
          retention-days: 14
          if-no-files-found: error

  spike-role-account:
    # A spike for remote machines (roadmap 01 §12), not a gate: a LaunchDaemon under a role account
    # and group of its own, started per connection on a loopback port, serving this commit's
    # `oomph serve --stdio` through /usr/bin/python3 with /var/empty as its home; how long a
    # connection takes to its first frame, cold, warm and under memory pressure. The results are
    # in the job's summary. The runner is thrown away afterwards; the script cleans up anyway.
    # On demand only (once per runner image is enough): `gh workflow run build.yml --ref main`.
    name: Spike, role account and first frame
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Role account, launchd job, first frame
        run: sudo tools/spike_role_account.sh "$GITHUB_STEP_SUMMARY"

  linux:
    # Linux for agents (1.9.4) on the supported systems (roadmap §10: Ubuntu 22.04+, Debian 12, the
    # RHEL 9 family): oomph and oomphd import without macOS's libraries; the self-test runs the
    # portable half on a stand-in for a Mac's backend (tools/fixtureplat.py) and then
    # tools/linuxtest.py: the Linux backend on recorded machines, the CLI's exit codes on this
    # system (the same table as on the Mac), the live backend (a child's 200 MB in its footprint),
    # `oomph top --once`, setup-claude and linux/install.sh into a scratch home. On 24.04 it also
    # runs in a 2 GB container, where oomph speaks about the container and two sessions take turns.
    name: Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version derives from `git describe`

      - name: Toolchain
        run: |
          uname -a
          python3 --version
          cat /proc/pressure/memory || echo "no PSI"
          cat /sys/fs/cgroup/cgroup.controllers || echo "no cgroup v2"

      - name: Lint
        run: |
          sh -n linux/install.sh linux/uninstall.sh
          bash -n install.sh uninstall.sh
          shellcheck -S error linux/install.sh linux/uninstall.sh
          python3 -I -m py_compile daemon/*.py tools/*.py

      - name: Import without macOS, doctor
        run: |
          python3 -I -B -c 'import sys; sys.path.insert(0, "daemon"); import oomph, oomphd, oomph_top, oomph_view, oomph_ai, oomph_upgrade, oomph_net, oomph_sync; assert "ctypes" not in sys.modules and "oomph_darwin" not in sys.modules; print("imported", oomph.VERSION, oomph.LOG_DIR, oomph.LEDGER_DIR)'
          set +e; python3 -I -B daemon/oomph.py doctor; rc=$?; set -e
          echo "doctor exit $rc"; test "$rc" = 0 || test "$rc" = 1   # it measures Linux now: 2 would be "cannot work here"
          python3 -I -B daemon/oomph.py check || test $? -le 2

      - name: Self-test
        env:
          OOMPH_LINUXTEST_STRICT: "1"   # a part that cannot run here fails instead of skipping
        run: |
          command -v tmux || { sudo apt-get update -q && sudo apt-get install -y -q tmux; }
          python3 -I -B tools/selftest.py

      - name: A 2 GB container, two sessions taking turns, and root
        # The CLI inside a container limited to 2 GB measures the container (cgroup scope), and the
        # exit codes and the turns of tools/linuxtest.py hold there, as an unprivileged user; then
        # as root without sudo (a root agent in a container): root's own ledger, in place.
        if: matrix.os == 'ubuntu-24.04'
        run: |
          docker run --rm --memory 2g -e DEBIAN_FRONTEND=noninteractive -e TZ=Etc/UTC -e OOMPH_LINUXTEST_STRICT=1 \
              -v "$PWD:/src:ro" ubuntu:24.04 sh -c '
            set -e
            apt-get update -q >/dev/null && apt-get install -y -q python3 procps >/dev/null
            useradd -m tester
            runuser -u tester -- env HOME=/home/tester OOMPH_LINUXTEST_STRICT=1 sh -c "cd /tmp && python3 -I -B /src/tools/linuxtest.py live linux"
            cd /tmp && HOME=/root python3 -I -B /src/tools/linuxtest.py root'

  linux-container:
    # The same on Debian 12 and Rocky 9 user space (Python 3.11 and 3.9), in containers on an Ubuntu
    # runner: the runner's kernel, no systemd; the self-test as an unprivileged user, then the
    # root part (the job's own user is root: root's own ledger in place, install.sh as root).
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      OOMPH_LINUXTEST_STRICT: "1"
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "rockylinux:9"]

    steps:
      - name: Python, git, tmux
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -q && apt-get install -y -q python3 git tmux procps util-linux ca-certificates openssl
          else
            dnf install -y -q python3 git tmux procps-ng diffutils findutils util-linux shadow-utils openssl
          fi
          python3 --version
          useradd -m tester

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test, as an unprivileged user
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- env HOME=/home/tester OOMPH_LINUXTEST_STRICT=1 sh -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && python3 -I -B tools/selftest.py"
          set +e; runuser -u tester -- env HOME=/home/tester python3 -I -B daemon/oomph.py doctor; rc=$?; set -e
          echo "doctor exit $rc"; test "$rc" = 0 || test "$rc" = 1

      - name: As root, without sudo
        # The workspace is the tester's now: git refuses it to root unless told it is safe, and
        # linux/install.sh would stamp 0.0.0-nogit instead of the real version.
        run: |
          export HOME=$(getent passwd 0 | cut -d: -f6)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          OOMPH_LINUXTEST_GIT=1 python3 -I -B tools/linuxtest.py root
