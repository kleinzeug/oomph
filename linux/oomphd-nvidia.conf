# Installed as /etc/systemd/system/oomphd.service.d/20-nvidia.conf by linux/install.sh --system where
# nvidia-smi and /dev/nvidiactl exist. The logger runs nvidia-smi as a program of its own (no GPU library
# is loaded into the logger); that program opens the cards' device files, which PrivateDevices=yes hides.
# Only the NVIDIA devices are let through, every other device stays closed. PrivateDevices=no would also
# share the host's /dev/shm and /dev/mqueue: the logger gets an empty /dev/shm of its own, and no mqueue.
[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-nvidiactl rw
DeviceAllow=char-nvidia rw
DeviceAllow=char-nvidia-frontend rw
DeviceAllow=char-nvidia-uvm rw
DeviceAllow=char-nvidia-caps rw
TemporaryFileSystem=/dev/shm
InaccessiblePaths=-/dev/mqueue
